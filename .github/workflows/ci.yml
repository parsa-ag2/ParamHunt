name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run test
      - run: npm run build
      # E2E runs headed chromium via xvfb when the extension logic lands (M1+):
      # - run: npx playwright install chromium && npm run test:e2e
